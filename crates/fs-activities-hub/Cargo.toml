[package]
name = "fs-activities-hub"
description = "Adapter from the FreeSynergy hub to the history core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-activities-core = { path = "../fs-activities-core" }
fs-registry-client = { git = "https://github.com/FreeSynergy/fs-registry", tag = "v0.0.2" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
serde_json = "1"
fs-registry = { git = "https://github.com/FreeSynergy/fs-registry", tag = "v0.0.2" }
